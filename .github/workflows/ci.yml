name: CI
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Which Rust crates exist, and are they all gated? ───────────────────────
  #
  # This repo is a set of standalone crates linked by path dependencies — there
  # is no root Cargo.toml, so `cargo test --workspace` covers nothing. The old
  # `rust` job pinned `working-directory: backend`, which meant ONE of the
  # fourteen crates was gated and the other thirteen — the SDK, all six moat
  # crates, the CLI, the Bevy client and all four game templates — compiled,
  # tested and linted nowhere.
  #
  # `ci/rust-crates.json` is the single source of truth for the matrix below.
  # `scripts/ci-crate-coverage.sh` asserts it lists exactly the crates that are
  # on disk, so adding a fifteenth crate without gating it FAILS CI instead of
  # quietly recreating the hole. It fails closed (missing jq / missing manifest
  # / zero crates found are all errors) and prints its coverage count.
  discover:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.manifest.outputs.crates }}
    steps:
      - uses: actions/checkout@v4
      - name: Every crate on disk is in the CI matrix
        run: bash scripts/ci-crate-coverage.sh
      - id: manifest
        run: echo "crates=$(jq -c . ci/rust-crates.json)" >> "$GITHUB_OUTPUT"

  # ── Every Rust crate: fmt, clippy, build, test ─────────────────────────────
  rust:
    needs: discover
    name: rust (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # One broken crate must not hide the state of the other thirteen.
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.discover.outputs.crates) }}
    defaults:
      run:
        working-directory: ${{ matrix.crate.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # The e2e leg additionally needs the wasip1 target to build the
          # sandbox artifact its tests load (see the step below). An empty
          # string is a no-op for every other matrix entry.
          targets: ${{ matrix.crate.name == 'e2e' && 'wasm32-wasip1' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate.dir }}

      # game-client-bevy builds Bevy's default (render) feature set, which links
      # ALSA and udev. Without these the crate — including src/main.rs, the only
      # target that compiles the binary at all — cannot be gated on Linux.
      - name: Install system dependencies
        if: matrix.crate.apt != ''
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.crate.apt }}

      # magnetite-e2e/tests/wasm_end_to_end.rs asserts sandbox/native parity
      # against a real game_template_authoritative.wasm. That artifact is
      # gitignored (**/target/) and built by NO other workflow — game-ci.yml
      # only builds the browser target (wasm32-unknown-unknown), a different
      # artifact at a different path. Without this step the e2e leg's three
      # artifact-dependent tests panic on a fresh checkout (see the fail-closed
      # `wasm.exists()` checks in that file). Build it here, before this leg's
      # own build/test steps, so the crate under test never has to do so.
      - name: Build wasm artifact for e2e (wasm32-wasip1)
        if: matrix.crate.name == 'e2e'
        working-directory: game-templates/authoritative
        run: cargo build --locked --release --target wasm32-wasip1 --features wasm

      - name: cargo fmt --check
        run: cargo fmt --check

      # --locked: the lockfile must already be correct. Two lockfiles in this
      # repo had drifted from their manifests precisely because nothing ever
      # resolved them in CI; without --locked, cargo silently rewrites them and
      # the drift is never reported.
      # --all-targets: tests, examples and benches are linted too. The old
      # backend-only job ran bare `cargo clippy`, so every #[cfg(test)] module
      # in the repo was exempt from -D warnings.
      - name: cargo clippy -D warnings
        run: cargo clippy --locked --all-targets ${{ matrix.crate.flags }} -- -D warnings

      - name: cargo build
        run: cargo build --locked --all-targets ${{ matrix.crate.flags }}

      - name: cargo test
        run: cargo test --locked ${{ matrix.crate.flags }}

  # ── Backend integration tests that require a live, migrated Postgres ──────
  #
  # backend/tests/session_revoke_tests.rs and admin_analytics_tests.rs each
  # carry `#[ignore = "requires DATABASE_URL against a migrated Postgres"]`
  # tests — including the ONLY test proving the cross-user session-revoke
  # route (`revoke_session`) is not an IDOR. `cargo test --locked` in the
  # `rust` job above never runs ignored tests, so that authorization
  # guarantee never executed anywhere in CI.
  #
  # Migrations are applied with `sqlx migrate run` — the same migration
  # runner the app itself uses (`sqlx::migrate!("./migrations")` in
  # backend/src/db/pool.rs, see backend/migrations/20250119000000_baseline.sql).
  # Deliberately NOT backend/tools/migrate.sh: that script is vestigial and
  # masked a broken migration chain by piping to psql with no
  # `ON_ERROR_STOP` (see the baseline migration's header comment).
  #
  # The two `--test` flags scope the run to exactly the two DB-backed
  # integration test binaries. A bare `--ignored` across the whole crate
  # would also pick up an unrelated doc-test fragment
  # (src/middleware/request_metrics.rs, fenced ```ignore because it is a
  # non-compiling usage snippet) and fail the job for a reason that has
  # nothing to do with DATABASE_URL.
  backend-db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magnetite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/magnetite_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # Pinned to the sqlx version this crate actually builds against
      # (backend/Cargo.lock: sqlx 0.8.6) so the CLI's migration bookkeeping
      # matches the `sqlx::migrate!` macro's exactly.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres,rustls --locked

      - name: Apply migrations (same runner as backend/src/db/pool.rs)
        run: sqlx migrate run

      - name: cargo test -- --ignored (DB-backed tests, incl. the IDOR proof)
        run: cargo test --locked --test session_revoke_tests --test admin_analytics_tests -- --ignored --test-threads=1

  # The frontend project lives in web/ (its own package.json/package-lock.json).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:lint-config
      - run: npm run typecheck
      # The unit/integration suite and the axe a11y suite run under separate
      # vitest configs (the default config excludes *.a11y.test.jsx); both must
      # run or a whole tranche of tests gates nothing.
      - run: npm run test:run
      - run: npm run test:a11y
      - run: npm run build

  # ── Every docs/ chapter reachable, every relative doc link resolves ────────
  #
  # An earlier audit found 16 real doc chapters with zero inbound links —
  # readable only by guessing the URL or grepping the repo — hand-fixed by
  # linking them into docs/index.md. Nothing stopped that from regressing
  # until scripts/check-docs-links.mjs existed to check it on every push. No
  # Node dependencies needed beyond the runtime itself (fs/path only).
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-docs-links.mjs

  release-checksums:
    # The release integrity gate is only worth having if its REFUSALS are
    # exercised, and a `v*` tag is far too late to find out that the verifier
    # waves through a release with no SHA256SUMS. `selftest` asserts each way a
    # release can be wrong (absent manifest, empty manifest, unbuilt asset,
    # unlisted asset, tampered bytes) still fails closed. Seconds to run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/release-checksums.sh selftest

      # The producer-side gate above and the USER-side verifier are different
      # scripts with different failure surfaces, and the user's is the one that
      # runs on an untrusted network. Its 24 synthetic-origin cases assert, for
      # each way a download can be wrong (manifest 404, HTML error page served
      # as the manifest, empty/garbage manifest, no entry for the asset, the
      # two name-matching traps, artifact 404, truncated transfer, digest
      # mismatch, missing tools), both the exit code and that a diagnostic was
      # actually printed.
      - run: bash scripts/verify.sh --selftest

  e2e:
    # Pinned, NOT ubuntu-latest: Playwright's bundled Chromium does not support
    # Ubuntu 26+, so `install --with-deps` on a bumped ubuntu-latest would break.
    # 22.04 is a Playwright-supported image (alternative: the mcr playwright
    # Docker image).
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The Playwright config's webServer starts `npm run dev` itself (fresh in
      # CI) and every spec stubs its own API, so no backend is needed. All 8
      # specs run (game-studio included since its rewrite).
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  responsive:
    # scripts/app-screenshots.mjs asserts no horizontal overflow on 14 routes x
    # 2 themes x 3 breakpoints against the PRODUCTION bundle. It has always
    # exited non-zero on overflow, but no workflow and no npm script invoked it,
    # so it gated nothing.
    #
    # It also fails closed now: a route that fails to navigate, whose click
    # target has vanished, or that renders a white screen is a hard failure —
    # a page that never loaded cannot overflow, so "no overflow" over a broken
    # page is not a pass. And it asserts the measurement COUNT (84) so a route
    # or theme silently dropping out of the loop fails rather than shrinking
    # what is checked.
    #
    # Without a flag the script writes captures to the gitignored
    # .responsive-check/app/, NOT the tracked docs/screenshots/app/ — a CI gate
    # must not rewrite its own tracked subject on every run. Refreshing the
    # committed screenshots is a deliberate, manual
    # `npm run screenshots:app -- --update-screenshots`, never something CI does.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The script serves web/dist itself and refuses to run without it.
      - run: npm run build
      # screenshots:app runs scripts/app-screenshots.mjs (repo root, invoked
      # via `../scripts/...` from web/'s package.json) and writes to the
      # gitignored .responsive-check/app/ at the REPO ROOT — see that script's
      # ROOT (computed from its own file location, not this job's cwd).
      - run: npm run screenshots:app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          path: .responsive-check/app/
          retention-days: 14
