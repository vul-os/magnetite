# Release: on a `v*` tag, build every artifact Magnetite publishes, write a
# SHA256SUMS manifest over all of them, verify that manifest, and attach the
# lot to a draft GitHub Release.
#
# ── What is published, and what is not ──────────────────────────────────────
#   magnetite-<ver>-<os>            the node/dev CLI (`magnetite-cli`, bin name
#                                   `magnetite`) — `magnetite dev`, `deploy`,
#                                   `serve`. The thing an operator actually runs.
#   magnetite-backend-<ver>-<os>    the platform backend (`backend`, bin name
#                                   `magnetite-backend`).
#   magnetite-web-<ver>.tar.gz      the built web client (`npm run build` →
#                                   `dist/`), for dropping behind any static host.
#   SHA256SUMS                      digests of all of the above.
#
#   Docker images are pushed by the `docker` job below and are NOT in
#   SHA256SUMS: a registry image is already addressed by its own content
#   digest (`docker pull magnetite/magnetite@sha256:...`), so a second,
#   differently-shaped manifest would add nothing and could disagree.
#
# ── Why the build matrix looks like this ────────────────────────────────────
# This workflow previously declared a cross-compile matrix
# (`x86_64-unknown-linux-musl`, `x86_64-apple-darwin`, `aarch64-unknown-linux-musl`)
# and ran every `cargo build` from the repo root. None of it could work: there
# is no root `Cargo.toml` (see ci.yml — each crate is standalone, linked by
# path deps, with its OWN `target/`), Apple targets do not link on an Ubuntu
# runner without an SDK, and no cross toolchain was configured for the musl
# targets. It also attached `dist/*` and `target/release/*` from a fresh
# checkout in a job that built nothing, and named a `magnetite-frontend`
# binary that exists in no crate in this repo. No `v*` tag has ever produced a
# working downloadable binary.
#
# The matrix is therefore the set of platforms a GitHub runner builds
# NATIVELY: linux-x86_64 (ubuntu-22.04) and macos-arm64 (macos-latest). Static
# musl and aarch64-linux builds are a real want — they need `cross` or a
# container toolchain, and until someone wires that up, publishing two working
# targets beats declaring three broken ones.
#
# ── Signing: what is and is not proved ──────────────────────────────────────
# SHA256SUMS on its own is an INTEGRITY manifest, not a signature: it lets a
# downloader detect a corrupted or substituted asset against the manifest they
# fetched alongside it, but a party who can serve you the assets can serve you
# a matching manifest, so on its own it proves only internal consistency.
#
# The `release` job therefore also attaches a sigstore BUILD PROVENANCE
# attestation over every asset (actions/attest-build-provenance, signed with a
# short-lived certificate minted from this workflow's OIDC token — no
# long-lived key, no repository secret, nothing to rotate). It binds the bytes
# to "this repository's release workflow at this commit", which is the claim
# the manifest alone could not make. Downloaders check it with
# `gh attestation verify` or `bash scripts/verify.sh --attest <asset>`.
#
# What that is NOT: it is not OS code-signing. macOS Gatekeeper and Windows
# SmartScreen know nothing about sigstore and will still warn on these
# binaries. And it is not load-bearing for integrity — verify.sh's digest path
# needs only curl and sha256sum, so if the attestation action is removed or
# broken, SHA256SUMS still verifies and no verification silently becomes a
# no-op. Do not describe these binaries as "code-signed".

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust binaries: the node CLI + the backend, per platform ───────────────
  build-binaries:
    name: Build binaries (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
          - platform: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(tr -d '[:space:]' < VERSION)"
          base="${tag%%-*}"   # v0.1.0-rc1 builds against base version 0.1.0
          echo "tag=$tag base=$base VERSION=$ver"
          [ "$base" = "$ver" ] || {
            echo "::error::Tag $tag does not match VERSION ($ver) — bump VERSION before tagging"
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable

      # Each crate has its own target/ (no root workspace), so cache them
      # separately — same shape as ci.yml's `workspaces: backend`.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            magnetite-cli

      - name: Build magnetite (node/dev CLI)
        working-directory: magnetite-cli
        run: cargo build --release --bin magnetite

      - name: Build magnetite-backend
        working-directory: backend
        run: cargo build --release --bin magnetite-backend

      - name: Stage assets
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p staging
          cp magnetite-cli/target/release/magnetite \
             "staging/magnetite-${ver}-${{ matrix.platform }}"
          cp backend/target/release/magnetite-backend \
             "staging/magnetite-backend-${ver}-${{ matrix.platform }}"
          ls -la staging

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: staging/*
          if-no-files-found: error

  # ── Web client: the built static bundle ──────────────────────────────────
  build-web:
    name: Build web bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Stage asset
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p staging
          tar -czf "staging/magnetite-web-${ver}.tar.gz" -C dist .
          ls -la staging

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: staging/*
          if-no-files-found: error

  # ── Checksums + draft release ────────────────────────────────────────────
  release:
    name: Checksum, attest and draft release
    needs: [build-binaries, build-web]
    runs-on: ubuntu-22.04
    permissions:
      contents: write       # create the draft Release and upload assets
      id-token: write       # mint the OIDC token the attestation is signed with
      attestations: write   # record the attestation against this repo
    steps:
      # Checked out only for scripts/release-checksums.sh — the assets come
      # from the build jobs above, never from the checkout.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-out
          pattern: binaries-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: release-out
          name: web

      - name: List assets
        id: ver
        run: |
          set -euo pipefail
          # Asset names carry the bare version (v0.1.0 -> magnetite-0.1.0-...),
          # so the tag cannot be pasted into the verify snippet unchanged.
          echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          ls -la release-out

      # Covers EVERY file staged above, and refuses to write a manifest for an
      # empty directory — a release whose builds all silently produced nothing
      # fails here rather than shipping a tidy, empty SHA256SUMS.
      - name: Emit SHA256SUMS
        run: bash scripts/release-checksums.sh emit release-out

      # Fail-closed re-derivation: a missing manifest, a listed-but-unbuilt
      # asset, a built-but-unlisted asset, or any digest mismatch is a red
      # build. There is no skip switch and no "manifest absent ⇒ nothing to
      # check" path — see the script header.
      - name: Verify SHA256SUMS
        run: bash scripts/release-checksums.sh verify release-out

      # The producer checked by the consumer. release-checksums.sh is the
      # producer's own re-derivation; scripts/verify.sh is the script a USER
      # runs. If the two ever disagree about the manifest format, it surfaces
      # here, in a red release job, rather than in a downloader's terminal
      # after the assets are public.
      - name: Verify with the same script users run
        run: |
          set -euo pipefail
          mapfile -t ASSETS < <(find release-out -maxdepth 1 -type f ! -name SHA256SUMS -exec basename {} \; | LC_ALL=C sort)
          [ "${#ASSETS[@]}" -gt 0 ] || { echo "::error::release-out/ holds no assets"; exit 1; }
          bash scripts/verify.sh --dir release-out "${ASSETS[@]}"

      # A verifier whose refusals are never exercised is a verifier that has
      # probably stopped refusing. 24 synthetic-origin cases, asserting the
      # exit code AND that a diagnostic was actually printed.
      - name: Prove the verifier still refuses broken releases
        run: bash scripts/verify.sh --selftest

      # Short-lived sigstore certificate minted from this job's OIDC identity —
      # no long-lived key, no repository secret, nothing to rotate. Attests
      # every file in release-out/ INCLUDING SHA256SUMS itself, so the
      # attestation on the manifest transitively covers every asset it names.
      - name: Attest build provenance (sigstore via OIDC — no long-lived key)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-out/*"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: Magnetite ${{ github.ref_name }}
          body: |
            ### Verify before you run this

            ```sh
            curl -fsSLO https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/verify.sh
            bash verify.sh --tag ${{ github.ref_name }} --attest magnetite-${{ steps.ver.outputs.ver }}-linux-x86_64
            ```

            `verify.sh` fetches `SHA256SUMS`, looks up the exact entry for the
            asset and compares digests. It exits non-zero, with a distinct
            diagnostic, on a missing or malformed manifest, a missing entry, a
            truncated download or a digest mismatch. There is no skip path.
            `--attest` additionally checks the sigstore build provenance (needs
            the `gh` CLI); without it, provenance is NOT checked and the script
            says so rather than letting a pass imply it.
          files: release-out/*

  # ── Container images ─────────────────────────────────────────────────────
  # Independent of the asset pipeline above: registry images carry their own
  # content digests and are not listed in SHA256SUMS.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: magnetite/magnetite
          tags: type=semver,pattern={{version}}
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}-frontend
          labels: ${{ steps.meta.outputs.labels }}
