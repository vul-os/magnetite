<!-- Resolve theme before paint to avoid a flash. Preference (light|dark|system)
     lives in localStorage 'vulos-theme'; <html data-theme> holds the RESOLVED
     light|dark value. Same contract as the landing page. -->
<script>
  (function () {
    try {
      var pref = localStorage.getItem('vulos-theme') || 'system';
      var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', pref === 'system' ? sys : pref);
      document.documentElement.setAttribute('data-theme-pref', pref);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>

  /* Dark-ground correction for the mark above. vulos-logo.png is flat #2E383A
     on transparency — ink drawn for paper — so composited on this surface it
     measures about 1.3:1 and reads as a smudge, not as a dimmed logo. The
     artwork carries its whole shape in the alpha channel, so brightness(0)
     invert(1) recolours it to the surface's foreground with the glyph intact,
     and the opacity holds it at the same secondary weight the light theme
     gives it. Styling only: the chrome markup stays byte-identical suite-wide. */
  :root:not([data-theme="light"]) .vulos-home img,

  { slug:'architecture',           title:'Architecture',              group:'How it works' },
  { slug:'seams',                  title:'The seams',                 group:'How it works' },
  { slug:'sandbox-abi',            title:'The sandbox ABI',           group:'How it works' },
  { slug:'payments',               title:'Payments',                  group:'How it works' },
  { slug:'economy-marketplace',    title:'Economy & marketplace',     group:'How it works' },
  { slug:'comms',                  title:'Comms',                     group:'How it works' },
  { slug:'web-bundles',            title:'Web bundles',               group:'How it works' },

  { slug:'cross-repo-backlog',     title:'Cross-repo backlog',        group:'Advanced / for developers' },
  { slug:'roadmap',                title:'Roadmap',                   group:'Advanced / for developers' },
];
const bySlug = Object.fromEntries(DOCS.map(d=>[d.slug,d]));
const content = document.getElementById('content');
const crumb = document.getElementById('crumb');
const navList = document.getElementById('navList');
const docToc = document.getElementById('docToc');
const docTocList = document.getElementById('docTocList');
let mermaidReady = false;
try { mermaid.initialize({ startOnLoad:false, theme: document.documentElement.getAttribute('data-theme')==='light' ? 'default' : 'dark', securityLevel:'loose', themeVariables:{ fontFamily:'var(--sans)' } }); mermaidReady = true; } catch(e){}

if (window.marked && marked.setOptions) marked.setOptions({ gfm:true, breaks:false });

/* ── Sidebar: build once from DOCS, grouped in array order ────────────── */
function buildNav(){
  const groups = [];
  const bySlugGroup = new Map();
  DOCS.forEach(d=>{
    if(!bySlugGroup.has(d.group)){ bySlugGroup.set(d.group, []); groups.push(d.group); }
    bySlugGroup.get(d.group).push(d);
  });
  const frag = document.createDocumentFragment();
  groups.forEach(g=>{
    const wrap = document.createElement('div');
    wrap.className = 'docs-nav-group';
    const label = document.createElement('p');
    label.className = 'label';
    label.textContent = g;
    wrap.appendChild(label);
    bySlugGroup.get(g).forEach(d=>{
      const a = document.createElement('a');
      a.href = '#'+d.slug;
      a.dataset.slug = d.slug;
      a.textContent = d.title;
      wrap.appendChild(a);
    });
    frag.appendChild(wrap);
  });
  navList.appendChild(frag);
}
buildNav();

function setActive(slug){
  document.querySelectorAll('.docs-nav a[data-slug]').forEach(a=>a.classList.toggle('active', a.dataset.slug===slug));
}

/* ── Chapter search filter ─────────────────────────────────────────────── */
const searchInput = document.getElementById('docsSearch');
function filterNav(){
  const q = searchInput.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('.docs-nav-group').forEach(group=>{
    let groupHasMatch = false;
    group.querySelectorAll('a[data-slug]').forEach(a=>{
      const match = !q || a.textContent.toLowerCase().includes(q);
      a.classList.toggle('no-match', !match);
      if(match) groupHasMatch = true;
    });
    group.style.display = groupHasMatch ? '' : 'none';
    if(groupHasMatch) anyVisible = true;
  });
  let empty = document.getElementById('navEmpty');
  if(!anyVisible){
    if(!empty){ empty = document.createElement('p'); empty.id='navEmpty'; empty.className='docs-nav-empty'; empty.textContent='No chapters match.'; navList.appendChild(empty); }
  } else if(empty){ empty.remove(); }
}
searchInput.addEventListener('input', filterNav);

/* Keyboard: "/" focuses the chapter filter from anywhere on the page,
   unless the user is already typing into a field. Nav links themselves are
   ordinary anchors, so they are already reachable and activatable by Tab/Enter. */
window.addEventListener('keydown', (e)=>{
  if(e.key === '/' && document.activeElement !== searchInput){
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    e.preventDefault();
    openDrawer(); // no-op on desktop widths (drawer is static there)
    searchInput.focus();
  }
});

/* ── Mobile drawer: the sidebar goes off-canvas instead of squashing the
   page. Opened by the header hamburger, closed by its own close button, the
   overlay, Escape, or picking a chapter. ──────────────────────────────── */
const drawerOpenBtn = document.getElementById('drawerOpen');
const drawerCloseBtn = document.getElementById('drawerClose');
const overlay = document.getElementById('drawerOverlay');
const docsNavEl = document.getElementById('docsNav');
function openDrawer(){
  if(window.innerWidth > 860) return;
  document.body.classList.add('drawer-open');
  drawerOpenBtn.setAttribute('aria-expanded','true');
}
function closeDrawer(){
  document.body.classList.remove('drawer-open');
  drawerOpenBtn.setAttribute('aria-expanded','false');
}
drawerOpenBtn.addEventListener('click', openDrawer);
drawerCloseBtn.addEventListener('click', closeDrawer);
overlay.addEventListener('click', closeDrawer);
window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && document.body.classList.contains('drawer-open')) closeDrawer(); });
navList.addEventListener('click', (e)=>{ if(e.target.closest('a[data-slug]')) closeDrawer(); });

/* ── On-page table of contents, built from whatever h2/h3 the chapter has.
   marked doesn't assign heading ids, so we mint them (slug + de-dupe) and
   link the TOC to them. ─────────────────────────────────────────────── */
function slugifyHeading(text, seen){
  /* "sec-" prefix is load-bearing, not decorative: DOCS slugs (e.g. "payments")
     double as page-router hashes, and a heading literally titled "Payments"
     inside some OTHER chapter would otherwise mint id="payments" and collide —
     clicking that TOC entry would then reroute to the Payments chapter instead
     of scrolling to the heading. The prefix makes that collision impossible. */
  let s = 'sec-'+text.toLowerCase().trim().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-');
  if(s === 'sec-') s = 'sec-section';
  let out = s, n = 2;
  while(seen.has(out)){ out = s+'-'+n; n++; }
  seen.add(out);
  return out;
}
function renderToc(){
  const heads = [...content.querySelectorAll('h2, h3')];
  docTocList.innerHTML = '';
  if(!heads.length){ docToc.style.display = 'none'; return; }
  docToc.style.display = '';
  const seen = new Set();
  heads.forEach(h=>{
    if(!h.id) h.id = slugifyHeading(h.textContent, seen); else seen.add(h.id);
    const li = document.createElement('li');
    li.dataset.lvl = h.tagName === 'H3' ? '3' : '2';
    const a = document.createElement('a');
    a.href = '#'+h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    docTocList.appendChild(li);
  });
}
/* Collapse the TOC by default on narrow screens so it doesn't eat the fold. */
if(window.innerWidth <= 640) docToc.removeAttribute('open');

async function renderMermaid(){
  if(!mermaidReady) return;
  const blocks = [...content.querySelectorAll('code.language-mermaid')];
  blocks.forEach((code,i)=>{
    const div = document.createElement('div');
    div.className='mermaid';
    div.textContent = code.textContent;
    code.closest('pre').replaceWith(div);
  });
  const nodes = content.querySelectorAll('.mermaid');
  if(nodes.length){ try { await mermaid.run({ nodes }); } catch(e){ console.warn('mermaid', e); } }
}

async function load(slug){
  const doc = bySlug[slug] || DOCS[0];
  setActive(doc.slug);
  crumb.textContent = doc.group + ' / ' + doc.title;
  content.innerHTML = 'Loading…';
  docToc.style.display = 'none';
  try {
    const res = await fetch('./docs/'+doc.slug+'.md', {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const md = await res.text();
    content.innerHTML = marked.parse(md);
    content.querySelectorAll('img').forEach(img=>{
      const s=img.getAttribute('src')||'';
      if(/^https?:/i.test(s)) return;
      const m=s.match(/(?:\.\.\/)*(?:docs\/)?screenshots\/(.+)$/);
      if(m) img.setAttribute('src','screenshots/'+m[1]);
    });
    content.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener';});
    await renderMermaid();
    renderToc();
    window.scrollTo({top:0});
  } catch(err){
    content.innerHTML = '<div class="docs-error">Could not load <code>'+doc.slug+'.md</code> — '+err.message+'</div>';
  }
}

function current(){
  const h = (location.hash||'').replace('#','');
  return bySlug[h] ? h : DOCS[0].slug;
}
/* A hash that names a chapter routes to it. A hash that doesn't (an
   in-page heading anchor from the TOC, or from a chapter's own
   "[Payments](#payments)"-style cross-reference landing mid-scroll) is left
   alone — the browser's native fragment scroll handles those without a
   reload. Cross-reference links that DO name a chapter still work via the
   normal route. */
window.addEventListener('hashchange', ()=>{
  const slug = (location.hash||'').replace('#','');
  if(bySlug[slug]) load(slug);
});
load(current());
</script>
<script>
  /* Light / Dark / System selector — same localStorage contract as the landing. */
  (function () {
    var root = document.documentElement;
    var mql = window.matchMedia('(prefers-color-scheme: dark)');
    function resolve(p){ return p === 'system' ? (mql.matches ? 'dark' : 'light') : p; }
    function currentPref(){ try { return localStorage.getItem('vulos-theme') || 'system'; } catch(e){ return 'system'; } }
    function apply(pref){
      root.setAttribute('data-theme', resolve(pref));
      root.setAttribute('data-theme-pref', pref);
      document.querySelectorAll('.theme-seg button').forEach(function(b){
        b.setAttribute('aria-pressed', String(b.dataset.set === pref));
      });
    }
    document.querySelectorAll('.theme-seg button').forEach(function(b){
      b.addEventListener('click', function(){
        var pref = b.dataset.set;
        try { localStorage.setItem('vulos-theme', pref); } catch(e){}
        apply(pref);
      });
    });
    mql.addEventListener('change', function(){ if (currentPref() === 'system') apply('system'); });
    apply(currentPref());
  })();
</script>
